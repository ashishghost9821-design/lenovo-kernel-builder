name: Build Lenovo TB-8505X Kernel with RTL8188FU

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Build Dependencies
      run: |
        sudo apt update
        sudo apt install -y build-essential libncurses5-dev gawk flex bison openssl \
        libssl-dev dkms libelf-dev libudev-dev libpci-dev libiberty-dev autoconf \
        llvm clang lld git bc ccache u-boot-tools crossbuild-essential-arm64 crossbuild-essential-armhf

    - name: Clone Lenovo TB-8505X Kernel Source
      run: |
        git clone --depth=1 https://github.com/CoderCharmander/tb8505f-kernel.git android_kernel
        
    - name: Inject RTL8188FU Driver Source
      run: |
        cd android_kernel
        git clone https://github.com/kelebek333/rtl8188fu.git drivers/net/wireless/realtek/rtl8188fu

    - name: Patch Kconfig and Makefile
      run: |
        cd android_kernel
        sed -i '/endif/i source "drivers/net/wireless/realtek/rtl8188fu/Kconfig"' drivers/net/wireless/realtek/Kconfig
        echo "obj-\$(CONFIG_RTL8188FU) += rtl8188fu/" >> drivers/net/wireless/realtek/Makefile

    - name: Fix Host Compiler GCC Compatibility (yylloc Error)
      run: |
        cd android_kernel
        # Force host compiler to allow duplicate definitions common in older codebases
        sed -i 's/^HOSTCFLAGS   :=/HOSTCFLAGS   := -fcommon /g' Makefile || true
        sed -i 's/^HOSTCFLAGS   =/HOSTCFLAGS   = -fcommon /g' Makefile || true
        
        # Directly patch the pre-generated lexer file if it exists to safely bypass duplication links
        if [ -f scripts/dtc/dtc-lexer.lex.c_shipped ]; then
          sed -i 's/YYLTYPE yylloc;/extern YYLTYPE yylloc;/g' scripts/dtc/dtc-lexer.lex.c_shipped
        fi

    - name: Configure Kernel Flags (Defconfig)
      run: |
        cd android_kernel
        echo "CONFIG_RTL8188FU=y" >> arch/arm64/configs/tb8505_defconfig

    - name: Compile Kernel
      run: |
        cd android_kernel
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
        
        make tb8505_defconfig
        # KCFLAGS="-w" turns off strict warnings to prevent modern GCC from dropping the compilation mid-way
        make -j$(nproc) Image HOSTCFLAGS="-fcommon" KCFLAGS="-w"

    - name: Upload Compiled Kernel Binary
      uses: actions/upload-artifact@v4
      with:
        name: Compiled-Kernel-Image
        path: android_kernel/arch/arm64/boot/Image
