name: Build Lenovo TB-8505X Kernel with RTL8188FU

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Build Dependencies
      run: |
        sudo apt update
        sudo apt install -y build-essential libncurses5-dev gawk flex bison openssl \
        libssl-dev dkms libelf-dev libudev-dev libpci-dev libiberty-dev autoconf \
        llvm clang lld git bc ccache u-boot-tools crossbuild-essential-arm64

    - name: Clone Lenovo TB-8505X Kernel Source
      run: |
        git clone --depth=1 https://github.com/theimpulson/android_kernel_lenovo_tb8505.git android_kernel
        
    - name: Inject RTL8188FU Driver Source
      run: |
        cd android_kernel
        git clone https://github.com/kelebek333/rtl8188fu.git drivers/net/wireless/realtek/rtl8188fu

    - name: Patch Kconfig and Makefile
      run: |
        cd android_kernel
        sed -i '/endif/i source "drivers/net/wireless/realtek/rtl8188fu/Kconfig"' drivers/net/wireless/realtek/Kconfig
        echo "obj-\$(CONFIG_RTL8188FU) += rtl8188fu/" >> drivers/net/wireless/realtek/Makefile

    - name: Configure Kernel Flags (Defconfig)
      run: |
        cd android_kernel
        echo "CONFIG_RTL8188FU=y" >> arch/arm64/configs/tb8505_defconfig

    - name: Compile Kernel
      run: |
        cd android_kernel
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        make tb8505_defconfig
        make -j$(nproc)

    - name: Upload Compiled Kernel Binary
      uses: actions/upload-artifact@v4
      with:
        name: Compiled-Kernel-Image
        path: android_kernel/arch/arm64/boot/Image.gz-dtb
